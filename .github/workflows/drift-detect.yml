name: appsec-drift-detect

# ACC 側の out-of-band 変更を検知し、差分があれば取り込み方法つきの Issue を立てる。
# 検知は三段: (1) 再 export と commit 済み baseline の diff（版の内容・export root 全体）
#            (2) staging / production に載っている版番号の diff（ロールバック検知）
#            (3) config レベルのオブジェクト一覧（custom rules / rate policies）の diff
# detect.py の exit: 0=clean / 10=drift / それ以外=異常（緑にせず赤で落とす）。

on:
  # 【最終運用形】スケジュール実行。ただしテンプレのままだと baseline 未commit で毎回失敗する。
  # instantiate 後に baseline を commit してから、下記のコメントを外して有効化すること。
  # schedule:
  #   - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read      # checkout のみ（baseline 更新は人が判断＝自動 push しない）
  issues: write       # ドリフトを Issue で通知

concurrency:
  group: appsec-drift-detect
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # 詰まった run を放置しない（既定 6 時間）
    env:
      CONFIG_NAME: ${{ vars.APPSEC_CONFIG_NAME }}
      CONFIG_ID: ${{ vars.APPSEC_CONFIG_ID }}
      AKAMAI_SECTION: default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"                   # cli-appsec が要求する Node（cli.json: 22.0.0）

      - name: Set up Akamai CLI + pinned plugins (.edgerc from secret)
        env:
          EDGERC: ${{ secrets.EDGERC }}       # run 本文へ直接展開しない（インジェクション回避）
        run: |
          set -euo pipefail
          umask 077                            # 生成時点から 600
          printf '%s' "$EDGERC" > "$HOME/.edgerc"
          # --- 版はすべて固定する。latest 追従だと export 出力が変わって
          #     baseline と食い違い、偽ドリフトや検知破綻を招くため。バンプ時はここを変える。
          CLI_VER=2.0.5                        # akamai CLI 本体
          TF_PLUGIN_VER=2.11.0                 # cli-terraform（export-appsec を生成する側）
          APPSEC_PLUGIN_VER=3.3.1              # cli-appsec（custom-rules / rate-policies を取得する側）
          SRC="$HOME/.akamai-cli/src"
          mkdir -p "$HOME/.local/bin" "$SRC"
          # CLI 本体（リリースバイナリを直接取得）
          curl -fsSL -o "$HOME/.local/bin/akamai" \
            "https://github.com/akamai/cli/releases/download/v${CLI_VER}/akamai-v${CLI_VER}-linuxamd64"
          chmod +x "$HOME/.local/bin/akamai"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          akamai --version
          # プラグインは akamai install（＝常に最新）を使わず、特定タグを clone して固定する。
          # cli-terraform: 版に対応するバイナリを bin/ に直接配置（install 時の自動取得に頼らない）。
          git clone --depth 1 --branch "v${TF_PLUGIN_VER}" \
            https://github.com/akamai/cli-terraform "$SRC/cli-terraform"
          mkdir -p "$SRC/cli-terraform/bin"
          curl -fsSL -o "$SRC/cli-terraform/bin/akamai-terraform" \
            "https://github.com/akamai/cli-terraform/releases/download/v${TF_PLUGIN_VER}/akamai-terraform-${TF_PLUGIN_VER}-linuxamd64"
          chmod +x "$SRC/cli-terraform/bin/akamai-terraform"
          # cli-appsec: Node 製。clone 後に本番依存だけ導入する。
          git clone --depth 1 --branch "$APPSEC_PLUGIN_VER" \
            https://github.com/akamai/cli-appsec "$SRC/cli-appsec"
          ( cd "$SRC/cli-appsec" && npm ci --omit=dev )
          # タグは可変参照なので、実際に入った版が指定どおりか確かめる（黙って別版で
          # 動くと export 出力が baseline とズレて偽ドリフトになる）
          akamai terraform --version | grep -q "$TF_PLUGIN_VER" \
            || { echo "::error::cli-terraform の版が $TF_PLUGIN_VER と一致しない"; exit 1; }
          akamai appsec --version | grep -q "$APPSEC_PLUGIN_VER" \
            || { echo "::error::cli-appsec の版が $APPSEC_PLUGIN_VER と一致しない"; exit 1; }

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Detect drift
        id: detect
        run: |
          set +e
          # パイプを使わず python の exit code を直接取る（shell 差で pipefail が外れても安全）
          python3 lib/detect.py \
            --baseline baseline \
            --baseline-objs baseline/objects.json \
            --config-name "$CONFIG_NAME" \
            --config-id "$CONFIG_ID" \
            --section "$AKAMAI_SECTION" \
            --json-out /tmp/report.json > /tmp/report.txt 2>&1
          code=$?
          cat /tmp/report.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0|10) : ;;                         # 既知の正常コード（0=clean, 10=drift）のみ通す
            *) echo "::error::detect.py 異常終了 code=$code（監視が死んでいる可能性）"; exit "$code" ;;
          esac

      - name: No drift
        if: steps.detect.outputs.code == '0'
        run: echo "drift なし。何もしない。"

      - name: Notify drift (Issue 作成、既に open なら内容が変わったときだけ追記)
        if: steps.detect.outputs.code == '10'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 差分＋取り込み用 Terraform を本文に生成（config 名は env 経由＝インジェクション回避）。
          # 末尾に内容の指紋をコメントとして埋め、次回が「既に通知済みか」を判定できるようにする。
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "lib"); import adopt
          rep = json.load(open("/tmp/report.json"))
          body = adopt.render_issue(rep, config_name=os.environ.get("CONFIG_NAME", ""),
                                    config_id=os.environ.get("CONFIG_ID"))
          fp = adopt.body_fingerprint(body)
          open("/tmp/issue.md", "w").write(body + "\n\n" + adopt.fp_marker(fp) + "\n")
          open("/tmp/issue.fp", "w").write(fp)
          PY
          fp="$(cat /tmp/issue.fp)"
          num="$(gh issue list -R "$REPO" --state open --label drift --json number --jq '.[0].number // empty')"
          if [ -z "$num" ]; then
            gh label create drift -R "$REPO" --color FBCA04 --description "AppSec drift 検知" 2>/dev/null || true
            gh issue create -R "$REPO" --title "AppSec ドリフト検知" --label drift --body-file /tmp/issue.md
            exit 0
          fi
          # open な Issue がある。重複 Issue は作らないが、黙って何もしないと
          # 「対応中に入った別の変更」が通知されない窓ができる。しかもその窓は、
          # 無害なドリフトを1つ起こすだけで意図的に開けられる。内容が変われば追記する。
          # パイプにしない: grep -q は一致した瞬間に閉じるため、本文が大きいと gh 側が
          # SIGPIPE で非ゼロ終了し、pipefail で「一致しているのに不一致」と判定されて
          # 毎時コメントが増え続ける（実測で 64KiB 超から発生）。一旦ファイルに落とす。
          gh issue view "$num" -R "$REPO" --json body,comments \
            --jq '[.body] + [.comments[].body] | join("\n")' > /tmp/existing.txt
          if grep -qF "$fp" /tmp/existing.txt; then
            echo "同じ内容のドリフトは Issue #$num に記録済み。追記しない。"
          else
            gh issue comment "$num" -R "$REPO" --body-file /tmp/issue.md
            echo "::warning::別のドリフトを検知しました。open な Issue #$num があるため新規作成せず、コメントで追記しています。"
          fi
